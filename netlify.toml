# Netlify Configuration for Job Portal

[build]
  base = "client"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# Redirect sitemap and robots.txt to backend
[[redirects]]
  from = "/sitemap.xml"
  to = "https://next-job-cfbh.onrender.com/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "https://next-job-cfbh.onrender.com/robots.txt"
  status = 200
  force = true

# API Proxy to backend
[[redirects]]
  from = "/api/*"
  to = "https://next-job-cfbh.onrender.com/api/:splat"
  status = 200
  force = true

# Redirect all requests to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


# Headers for better security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
